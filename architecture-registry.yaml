patterns_established:
  - id: PAT001
    title: "Endpoint leve para selects/dropdowns"
    rule: >
      Nunca usar GetAll (payload completo) para preencher selects ou dropdowns no frontend.
      Sempre criar ou usar endpoint Summary (id + label + campos mínimos).
    example: "CustomerController.GetAllSummary → FormOrderService dropdown de clientes"

  - id: PAT002
    title: "Task.WhenAll com EF Core — um scope por task"
    rule: >
      DbContext não é thread-safe. Para Task.WhenAll com múltiplas queries paralelas,
      cada task deve criar seu próprio IServiceScope e obter uma instância independente.
      NUNCA compartilhar uma única instância de DbContext entre tasks.
    example: "CustomerDataRepository.GetAll — historicosTask e servicosTask criam scope por chunk"

  - id: PAT003
    title: "Horário de negócio sempre UTC→Brasil"
    rule: >
      Em produção (Azure) DateTime.Now retorna UTC+0. Para qualquer regra de negócio
      com base em horário brasileiro, usar:
        var tz = TimeZoneInfo.FindSystemTimeZoneById(
            OperatingSystem.IsWindows() ? "E. South America Standard Time" : "America/Sao_Paulo");
        return TimeZoneInfo.ConvertTimeFromUtc(DateTime.UtcNow, tz);
    example: "OrderServiceSessionService.Agora() — regra das 48h para check-in"

  - id: PAT005
    title: "Bounded context de leitura com contexto EF proprio"
    rule: >
      Modulo de leitura pesada (insight, relatorio, BI) nao estende os filtros de um
      endpoint de CRUD ja existente. Cria contexto EF proprio com:
        1. QueryTrackingBehavior.NoTracking global;
        2. read models que projetam SO as colunas necessarias das tabelas de outro contexto,
           mapeadas com ToTable(nome, t => t.ExcludeFromMigrations());
        3. MigrationsHistoryTable dedicada — sem isso os dois contextos disputam
           __EFMigrationsHistory e o EF tenta dropar o schema do outro;
        4. indices de apoio nas tabelas alheias por migrationBuilder.Sql com IF NOT EXISTS,
           ja que o BC nao e dono daquele schema.
      Contador e listagem precisam sair da MESMA IQueryable, diferindo so no terminal
      (CountAsync ou Skip/Take): duas definicoes da regra divergem com o tempo.
      Validar sempre com 'dotnet ef migrations script --context <BC>' antes de aplicar —
      o script nao pode conter DROP ou ALTER de tabela de outro contexto.
    example: "InsightsReadContext + InsightQueryRepository.Consultar (api/Insights)"

  - id: PAT006
    title: "Predicado de consulta EF: inline, nunca em metodo auxiliar"
    rule: >
      Condicao dentro de expression tree precisa ser escrita inline. Extrair para metodo
      auxiliar mantem os testes LINQ-to-objects e InMemory verdes, mas o EF Core nao traduz
      chamada de metodo e a consulta so quebra em producao. O mesmo vale para
      EF.Functions.DateDiffDay, que derruba a consulta para avaliacao no cliente: projete a
      data crua e faca a aritmetica na camada de Application.
      Cobrir com teste que gera o SQL via ToQueryString() — compila a consulta sem abrir
      conexao, de forma deterministica.
    example: "InsightSpecifications + InsightTraducaoSqlTests"

  - id: PAT004
    title: "Retorno de erro HTTP — nunca Forbid(string)"
    rule: >
      Forbid(string) em ASP.NET Core interpreta o argumento como nome de esquema de
      autenticação, não como mensagem. Usar:
        - Unauthorized(new { error = '...' }) para credenciais inválidas (401)
        - StatusCode(403, new { error = '...' }) para acesso negado (403)
    example: "UserController.LoginUser → Unauthorized(new { error = 'Credenciais inválidas.' })"

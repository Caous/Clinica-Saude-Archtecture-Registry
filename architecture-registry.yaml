organization:
  name: Instituto Barros
  domain: Clínica de Fisioterapia
  units:
    - Morumbi
    - Mooca
    - Paulista
    - Ipiranga
  environments:
    - name: development
      api_url: http://localhost:8080
      admin_url: http://localhost:5173
      portal_url: http://localhost:3000
    - name: production
      api_url: https://instituto-barros-sistema.azurewebsites.net  # Azure Web App
      admin_url: https://sistema-instituto.vercel.app
      portal_url: https://instituto-barros-portal-cliente.vercel.app

# ─────────────────────────────────────────────
# SERVIÇOS / APLICAÇÕES
# ─────────────────────────────────────────────
services:

  # ── 1. API BACKEND ────────────────────────────────────────────────────────────
  - name: instituto-barros-api
    type: api
    description: >
      API REST central do Instituto Barros. Expõe todos os endpoints de negócio:
      gestão de pacientes, funcionários, filiais, agendamentos, ordens de serviço,
      sessões, financeiro, notificações, WhatsApp e autenticação.
    language: C# .NET 8.0
    architecture: DDD (Domain-Driven Design) + Clean Architecture
    path: Instituto_Barros_Sistema/
    solution: Instituto_Barros_Sistema.sln
    swagger: /swagger/index.html  # disponível apenas em Development e QA
    docker_image: tecnologiainstitutobarrros/sistema-instituto
    deployed_at: Azure Web App (instituto-barros-sistema)

    layers:
      domain:
        path: src/Domain/DomainDrivenDesign.Domain/
        entities:
          - name: BaseModel
            description: Classe base herdada por todas entidades. Contém Id (Guid, SequentialGuid), DataCadastro (default GETDATE()), DataDesativacao (soft-delete nullable).
          - name: UserModel
            table: UsuariosData (AspNetUsers via Identity)
            fields: [Id, UserName, Email, PasswordHash, Roles, NormalizedEmail, ...]
          - name: CustomerModel
            table: Customer
            fields: [Id, Nome, Email?, CPF, RG?, NrTelefone, DataNascimento, IsEstrangeiro, Endereco(FK), DataCadastro, DataDesativacao]
          - name: HistoryCustomerModel
            table: HistoryCustomer
            fields: [Id, CustomerId(FK), Descricao, DataCadastro]
          - name: BranchOfficeModel
            table: BranchOfficeService
            fields: [Id, Nome, Cidade, Estado, Endereco, DataCadastro, DataDesativacao]
          - name: EmployeeModel
            table: Employee
            fields: [Id, Nome, Email, NrTelefone, Cargo, DataNascimento, ContatoEmergencial, Cor(hex), BranchOfficeId(FK), UserId(FK), DataCadastro, DataDesativacao]
          - name: CategoryServiceModel
            table: CategoryService
            fields: [Id, Nome, Descricao, DataCadastro, DataDesativacao]
          - name: SubCategoryServiceModel
            table: SubCategoryService
            fields: [Id, Nome, Descricao, Valor, CategoryServiceId(FK), DataCadastro, DataDesativacao]
          - name: OrderServiceModel
            table: OrderService
            fields: [Id, CustomerId(FK), BranchOfficeId(FK), SubCategoryServiceId(FK), EmployeeId(FK), Status(EOrderServiceStatus), TotalSessoes, SessoesRealizadas, Observacoes, DataCadastro, DataDesativacao]
          - name: OrderServiceSessionModel
            table: OrderServiceSessions
            fields: [Id, OrderServiceId(FK), EmployeeId(FK), DataSessao, HoraInicio, HoraFim, Status(ESessionStatus), Observacoes, DataCadastro]
          - name: ScheduleModel
            table: Schedule
            fields: [Id, Titulo, DataInicio, DataFim, HoraInicio, HoraFim, BranchOfficeId(FK), Status(EScheduleStatus), IsAvaliacao, DataCadastro, DataDesativacao]
          - name: ScheduleParticipantModel
            table: ScheduleParticipants
            fields: [Id, ScheduleId(FK), EmployeeId(FK), CustomerId(FK)?, DataCadastro]
          - name: NotificationModel
            table: Notifications
            fields: [Id, Titulo, Mensagem, TipoNotificacao(ENotificationType), OrderServiceId(FK)?, DataCadastro, DataDesativacao]
          - name: NotificationUserViewModel
            table: NotificationUserViews
            fields: [Id, NotificationId(FK), UserId, VisualizadoEm, DataCadastro]
          - name: FinancialTransactionModel
            table: TransacoesFinanceiras
            fields: [Id, Descricao, Valor, FormaPagamento(EPaymentMethod), Status(EFinanceiroStatus), BranchOfficeId(FK), OrderServiceId(FK)?, DataTransacao, DataCadastro, DataDesativacao]
          - name: InstallmentModel
            table: Parcelas
            fields: [Id, FinancialTransactionId(FK), NumeroParcela, Valor, DataVencimento, Status(EFinanceiroStatus), DataPagamento?, DataCadastro]
          - name: LogModel
            table: Logs
            fields: [Id, UserId, UserName, Acao, Entidade, EntidadeId, Detalhes, DataCadastro]
          - name: WhatsappNumberModel
            table: WhatsappNumbers
            fields: [Id, NomeInstancia, Numero, FilialId(FK)?, Ativo, TokenInstancia(encrypted-AES256), UltimaConexao?, MetadadosJson(encrypted-AES256)?, DataCadastro, DataDesativacao]
          - name: WhatsappConversationModel
            table: WhatsappConversations
            fields: [Id, WhatsappNumberId(FK), CustomerId(FK)?, NrTelefoneCliente, NomeContato, Status(EWhatsappConversationStatus), TipoAtendimento(ETipoAtendimentoWhatsapp)?, EsteiraBot?, MensagensNaoLidas, MetadadosJson(encrypted-AES256)?, DataCadastro, DataDesativacao]
          - name: WhatsappMessageModel
            table: WhatsappMessages
            fields: [Id, WhatsappConversationId(FK), MessageId, Conteudo, TipoMidia?, UrlMidia?, EnviadaPelaClinica, Status(EWhatsappMessageStatus), DataMensagem, DataCadastro]

        enumerations:
          - EOrderServiceStatus: [Ativo, Concluido, Cancelado]
          - ESessionStatus: [Agendada, Realizada, Cancelada, NaoCompareceu]
          - EScheduleStatus: [Agendado, Confirmado, Cancelado, Realizado]
          - EPaymentMethod: [Dinheiro, Cartao, Pix, Boleto, Convenio, Misto]
          - EFinanceiroStatus: [Pendente, Pago, Cancelado, Vencido]
          - ENotificationType: [Geral, AgendamentoProximo, SessaoIniciada, PagamentoPendente]
          - EWhatsappConversationStatus: [Ativa, Encerrada, Aguardando]
          - ETipoAtendimentoWhatsapp: [Reabilitacao, Prevencao, Recovery, Agendamento, Informacoes, NenhumServico]
          - EWhatsappMessageStatus: [Enviada, Entregue, Lida, Falha]

        interfaces:
          repositories:
            - IManagerUserDataRepository
            - ICustomerDataRepository
            - IHistoryCustomerDataRepository
            - ICategoryServiceDataRepository
            - ISubCategoryServiceDataRepository
            - IOrderServiceDataRepository
            - IOrderServiceSessionDataRepository
            - IServiceDataRepository
            - IEmployeeServiceDataRepository
            - IBranchOfficeServiceDataRepository
            - IScheduleDataRepository
            - IScheduleParticipantDataRepository
            - IDashboardDataRepository
            - INotificationDataRepository
            - IFinancialTransactionDataRepository
            - IInstallmentDataRepository
            - ILogDataRepository
            - IWhatsappNumberDataRepository
            - IWhatsappConversationDataRepository
          services:
            - IManagerUserDataService
            - ICustomerDataService
            - ICategoryServiceDataService
            - ISubCategoryServiceDataService
            - IOrderServiceDataService
            - IOrderServiceSessionDataService
            - IServiceServiceDataService
            - IEmployeeServiceDataService
            - IBranchOfficeServiceDataService
            - IScheduleDataService
            - IScheduleParticipantDataService
            - IDashboardDataService
            - INotificationDataService
            - IFinancialTransactionDataService
            - IInstallmentDataService
            - ILogDataService
            - IWhatsappNumberDataService
            - IWhatsappConversationDataService

      infrastructure:
        path: src/Infrastructure/
        context: InstitutoContext (extends IdentityDbContext<UserModel>)
        migrations_assembly: DomainDrivenDesign.Infrastructure.Data
        repositories_path: src/Infrastructure/DomainDrivenDesign.Infrastructure.Data/Repositories/
        mappers_path: src/Application/DomainDrivenDesign.Application/Mapper/  # ATENÇÃO: mappers EF ficam em Application
        migrations_count: 30+  # último: AddOrderServiceIdToNotifications (2026-03)

        # PADRÃO CRÍTICO - Sempre seguir em novos mappers:
        mapper_patterns:
          pk: HasKey(x => x.Id) + HasValueGenerator<SequentialGuidValueGenerator>()
          data_cadastro: HasDefaultValueSql("GETDATE()")
          soft_delete: DataDesativacao nullable, sem filtro global automático
          encryption: DatabaseEncryptionHelper.EncryptField/DecryptField em HasConversion para campos sensíveis

        # PADRÃO CRÍTICO - Repositórios:
        repository_patterns:
          base: RepositoryBase<T> (herança obrigatória)
          save_changes: Create/Update/Delete NÃO chamam SaveChangesAsync — Domain Service chama explicitamente

      application:
        path: src/Application/DomainDrivenDesign.Application/
        services:
          - ManagerUserService (IManagerUserService)
          - CustomerService (ICustomerService)
          - CategoryService (ICategoryService)
          - SubCategoryService (ISubCategoryService)
          - OrderServiceService (IOrderServiceService)
          - OrderServiceSessionService (IOrderServiceSessionService)
          - EmployeeService (IEmployeeService)
          - BranchOfficeService (IBranchOfficeService)
          - ScheduleService (IScheduleService)
          - ScheduleParticipantService (IScheduleParticipantService)
          - DashboardService (IDashboardService)
          - NotificationService (INotificationService)
          - FinancialTransactionService (IFinancialTransactionService)
          - InstallmentService (IInstallmentService)
          - LogService (ILogService)
          - AuditLogService (IAuditLogService)
          - SecurePasswordRecoveryService (ISecurePasswordRecoveryService)
          - SessionManagementService (ISessionManagementService) — Singleton
          - CustomerAccessService (ICustomerAccessService) — TEMPORÁRIO
          - WhatsappNumberService (IWhatsappNumberService)
          - WhatsappConversationService (IWhatsappConversationService)
        helpers:
          - DatabaseEncryptionHelper: AES-256 CBC. Métodos: EncryptField(string?), DecryptField(string?). Registrado como Singleton.
          - EmailHelper
          - FormatHelper
          - InputSanitizationHelper
        validators:  # FluentValidation
          - UserCreateValidator, UserLoginValidator, ClienteLoginValidator
          - CustomerValidator, CustomerUpdateProfileValidator
          - CategoryServiceValidator, BranchOfficeValidator, EmployeeValidador
          - NotificationRequestDtoValidator, NotificationHistoryRequestValidator
          - FinancialTransactionRequestDtoValidator, LogRequestDtoValidator
          - CustomerAccessValidator
          - SolicitarResetSenhaValidator, ResetPasswordValidator
          - CreateAppointmentValidator, CancelAppointmentValidator
        automapper:
          profile: MapperProfile (src/Application/DomainDrivenDesign.Application/ResolveMapper/)

      presentation:
        path: src/Presentation/DomainDriveDesign.Presentation.Api/
        base_controller: MainController  # expõe UserId, UserName
        middleware:
          - SecurityHeadersMiddleware  # headers de segurança HTTP
          - InputValidationMiddleware  # sanitização de inputs
          - AntiForgeryMiddleware     # proteção CSRF (header X-CSRF-Token)
        global_filter: GlobalExceptionFilter
        converters: [DateOnlyConverter, TimeOnlyConverter]

    controllers:
      # Formato: route | method | auth | description
      - controller: UserController
        route: /Api/User
        endpoints:
          - "GET    /SearchUser                     | Authorize (qualquer role) | Busca usuário por email ou id"
          - "POST   /RegisterUser                   | AllowAnonymous            | Cria novo usuário (⚠ AV008: deveria exigir Administrador)"
          - "POST   /LoginUser                      | AllowAnonymous            | Login com email/senha → JWT + HttpOnly cookie"
          - "POST   /LoginCliente                   | AllowAnonymous            | Login de cliente com CPF/senha"
          - "POST   /SolicitarResetSenha            | AllowAnonymous            | Solicita reset de senha por email"
          - "POST   /ResetarSenha                   | AllowAnonymous            | Confirma reset com token"
          - "GET    /GetCsrfToken                   | AllowAnonymous            | Retorna token CSRF"
          - "GET    /FuncionarioAccess/{funcionarioId} | Authorize              | Retorna userId, userName, email e roles do usuário vinculado ao funcionário (⚠ CS023: sem restrição de role — qualquer autenticado acessa)"
          - "DELETE /{userId}/Role/{role}           | Authorize                 | Remove uma role do usuário (⚠ CS023: sem restrição de role)"
          - "POST   /{userId}/Role/{role}           | Authorize                 | Adiciona uma role ao usuário (⚠ CS023: sem restrição de role)"

      - controller: CustomerController
        route: /api/Customer
        roles: [Administrador, Administrativo, Comercial, Fisioterapeuta, Funcionario, CoordenadorFisioterapeuta]
        endpoints:
          - "GET    /GetAll                | Listagem de pacientes com filtros (page?, pageSize? opcionais). Backward-compatible sem paginação."
          - "GET    /GetAllSummary         | Listagem leve (id, nome, telefone). Usar para selects/dropdowns — evita timeout de produção."
          - "GET    /GetById/{id}          | Busca paciente por ID"
          - "POST   /Create               | Cria paciente"
          - "PUT    /Update/{id}          | Atualiza paciente"
          - "DELETE /Delete/{id}          | Soft-delete paciente"

      - controller: BranchOfficeController
        route: /api/BranchOffice
        roles: [Administrador, Administrativo]
        endpoints:
          - "GET    /GetAll               | Lista filiais"
          - "POST   /Create               | Cria filial"
          - "PUT    /Update/{id}          | Atualiza filial"
          - "DELETE /Delete/{id}          | Remove filial"

      - controller: EmployeeController
        route: /api/Employee
        roles: [Administrador, Administrativo, Comercial, Fisioterapeuta, Funcionario, CoordenadorFisioterapeuta, Financeiro]
        endpoints:
          - "GET    /GetAll               | Lista funcionários"
          - "POST   /Create               | Cria funcionário"
          - "PUT    /Update/{id}          | Atualiza funcionário"
          - "DELETE /Delete/{id}          | Remove funcionário"

      - controller: CategoryServiceController
        route: /api/CategoryService
        roles: [Administrador, Administrativo]

      - controller: SubCategoryController
        route: /api/SubCategory
        roles: [Administrador, Administrativo, Comercial]

      - controller: OrderServiceController
        route: /api/OrderService
        roles: [Administrador, Administrativo, Comercial, Fisioterapeuta, Funcionario, CoordenadorFisioterapeuta]

      - controller: SessionServiceController
        route: /api/SessionService
        endpoints:
          - "GET    /GetAll               | Lista sessões"
          - "POST   /Create               | Cria sessão"
          - "PUT    /Update/{id}          | Atualiza sessão"
          - "GET    /DailySummary         | Resumo diário de sessões por fisioterapeuta"

      - controller: ScheduleController
        route: /api/Schedule
        rate_limit: "10 GET/30s, write sem limite"
        endpoints:
          - "GET    /GetAll               | Lista agendamentos (com filtro por employee)"
          - "POST   /Create               | Cria agendamento"
          - "PUT    /Update/{id}          | Atualiza agendamento"
          - "DELETE /Delete/{id}          | Remove agendamento"

      - controller: ScheduleParticipantController
        route: /api/ScheduleParticipant

      - controller: DashboardController
        route: /api/Dashboard
        rate_limit: "20 req/30s"
        endpoints:
          - "GET /FaturamentoMensal       | Faturamento mensal por período"
          - "GET /FaturamentoComparativo  | Comparativo entre períodos"
          - "GET /DespesasResumo         | Resumo de despesas"
          - "GET /EntradaSaida           | Entradas vs saídas"
          - "GET /TiposPagamento         | Breakdown por forma de pagamento"
          - "GET /ServicoReceita         | Receita por tipo de serviço"
          - "GET /UnidadesTransacao      | Performance por unidade"
          - "GET /Patologias             | Distribuição de patologias"
          - "GET /SessoesMensais         | Sessões mensais por fisioterapeuta"
          - "GET /SessoesDiarias         | Resumo diário de sessões"

      - controller: TransactionsController
        route: /api/Transactions
        roles: [Administrador, Financeiro]

      - controller: InstallmentsController
        route: /api/Installments
        roles: [Administrador, Financeiro]

      - controller: NotificationsController
        route: /api/Notifications
        endpoints:
          - "GET    /GetAll               | Lista notificações"
          - "POST   /Send                 | Envia notificação"
          - "GET    /History              | Histórico de notificações com filtros"
          - "PATCH  /MarkAsRead/{id}      | Marca como lida"

      - controller: LogsController
        route: /api/Logs
        roles: [Administrador]

      - controller: ClienteController
        route: /api/Cliente
        description: Endpoints exclusivos do Portal Cliente (Next.js)
        endpoints:
          - "POST /LoginCliente           | Login com CPF (redirecionado para UserController)"
          - "GET  /GetPerfil              | Perfil do cliente autenticado"
          - "PUT  /UpdatePerfil           | Atualiza perfil (nome, email, telefone)"
          - "GET  /GetAgendamentos        | Agendamentos do cliente"
          - "POST /SolicitarAgendamento   | Solicita agendamento"
          - "POST /CancelarAgendamento    | Cancela agendamento"

      - controller: CustomerAccessController
        route: /api/CustomerAccess
        roles: [Administrador, Administrativo]
        description: "TEMPORÁRIO - Sistema de criação automática de acesso para clientes"

      - controller: WhatsappController
        route: /api/Whatsapp
        roles: [Administrador, Comercial, Administrativo]
        endpoints:
          - "POST  /ReceberMensagem       | Chamado pelo n8n ao receber/enviar mensagem. Cria/atualiza conversa automaticamente."
          - "GET   /GetConversas          | Lista conversas ativas. Query: whatsappNumberId?"
          - "GET   /GetMensagens/{id}     | Lista mensagens de uma conversa"
          - "PATCH /MarcarComoLida/{id}   | Zera contador MensagensNaoLidas de uma conversa"

      - controller: WhatsappNumberController
        route: /api/WhatsappNumber
        roles:
          read: [Administrador, Comercial, Administrativo]
          write: [Administrador]
        endpoints:
          - "POST   /Register             | Cadastra novo número/instância WhatsApp"
          - "GET    /GetAll               | Lista todos os números"
          - "PUT    /Update/{id}          | Atualiza dados do número"
          - "PATCH  /ToggleActive/{id}    | Ativa/desativa número"

    auth:
      provider: ASP.NET Identity + JWT Bearer
      token_delivery: HttpOnly cookie (nome: AccessToken)
      expiry: 1 hora
      cookie_options: [HttpOnly, Secure, SameSite=Strict]
      csrf: X-CSRF-Token header (endpoint GET /Api/User/GetCsrfToken)
      roles:
        - Cliente            # acesso ao Portal Cliente
        - Administrador      # acesso total
        - Funcionario        # acesso operacional básico
        - Comercial          # acesso comercial + WhatsApp
        - Fisioterapeuta     # acesso clínico (próprios agendamentos)
        - Administrativo     # acesso administrativo
        - CoordenadorFisioterapeuta  # fisioterapeuta com visão de todos
        - Financeiro         # acesso ao módulo financeiro

    rate_limiting:
      provider: .NET RateLimiter (PartitionedRateLimiter, per-IP)
      rules:
        - endpoint: Login (POST /Api/User/LoginUser, LoginCliente)
          limit: 5 req / 5 min
        - endpoint: SolicitarResetSenha
          limit: 3 req / 1 hora
        - endpoint: RegisterUser
          limit: 3 req / 1 hora
        - endpoint: Schedule (GET)
          limit: 10 req / 30s
        - endpoint: Dashboard
          limit: 20 req / 30s
        - endpoint: BranchOffice, Employee, Cliente, SessionService, OrderService
          limit: sem limite
        - endpoint: demais
          limit: 7 req / 30s

    database:
      - provider: sqlserver
        connection_key: DefaultConnection
        context: InstitutoContext
        tables:
          - Customer, HistoryCustomer
          - UsuariosData (AspNetUsers + Identity tables)
          - CategoryService, SubCategoryService
          - OrderService, OrderServiceSessions
          - Schedule, ScheduleParticipants
          - BranchOfficeService, Employee
          - Notifications, NotificationUserViews
          - TransacoesFinanceiras, Parcelas
          - Logs
          - WhatsappNumbers, WhatsappConversations, WhatsappMessages  # pendente migration AddWhatsappModule

      - provider: mongodb
        connection_key: MongoConnection
        database: leads
        use_case: Base de leads capturados pelo bot n8n (WhatsApp)

    encryption:
      algorithm: AES-256 CBC
      helper: DatabaseEncryptionHelper (Singleton)
      encrypted_fields:
        - WhatsappNumberModel.TokenInstancia
        - WhatsappNumberModel.MetadadosJson
        - WhatsappConversationModel.MetadadosJson

    security:
      middlewares:
        - SecurityHeadersMiddleware: HSTS, X-Content-Type-Options, X-Frame-Options, CSP, Referrer-Policy
        - InputValidationMiddleware: sanitização com DOMPurify-style server-side
        - AntiForgeryMiddleware: validação de token CSRF
      cors:
        origins:
          - http://localhost:3000
          - http://localhost:5173
          - https://sistema-instituto.vercel.app
          - https://instituto-barros-portal-cliente.vercel.app
        methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
        headers: [Content-Type, Authorization, X-Requested-With]

    ci_cd:
      provider: GitHub Actions
      workflow: .github/workflows/instituto_barros.yml
      pipeline:
        - trigger: push to main
        - build: Docker image (alpine)
        - push: Docker Hub (tecnologiainstitutobarrros/sistema-instituto:{sha})
        - deploy: Azure Web App (instituto-barros-sistema, slot Production)

    deployment:
      platform: Azure Web App (container)
      containerization: Docker (mcr.microsoft.com/dotnet/aspnet:8.0-alpine)
      port: 80 (container) / HTTPS via Azure

  # ── 2. SISTEMA ADMINISTRATIVO (Frontend) ────────────────────────────────────
  - name: instituto-barros-admin
    type: frontend
    description: >
      Painel administrativo da clínica. Usado por funcionários, fisioterapeutas,
      coordenadores, comercial, administrativo e financeiro. Consome a API backend.
    framework: React 18 + Vite + TypeScript
    path: Instituto_Barros_Front/FrontEnd_Instituto_Barros/FrontEnd_Instituto_Barros/
    deployed_at: Vercel (https://sistema-instituto.vercel.app)
    dev_port: 5173

    dependencies:
      ui: [TailwindCSS v4, Lucide React, Apexcharts, React Apexcharts]
      state: [Zustand v5]
      http: [Axios v1.8]
      routing: [React Router v7]
      calendar: [FullCalendar v6 (daygrid, timegrid, list, interaction)]
      forms: [React Input Mask, React Number Format, React Select, React Dropzone]
      utilities: [date-fns, DOMPurify, jwt-decode, clsx, Flatpickr]

    routes:
      public:
        - /signin        → SignIn
        - /signup        → SignUp
      protected:  # requer JWT válido (ProtectedRoute)
        - /              → DashboardRedirect (redireciona por role)
        - /dashboard-operacao     → DashboardOperacao          [todos]
        - /dashboard-lead         → DashboardLead              [Adm, Adm, Comercial, Func]
        - /profile                → UserProfiles               [todos]
        - /calendar               → Calendar                   [todos]
        - /customer               → CustomerTables             [todos]
        - /form-employee          → EmployeeTables             [Adm, Adm, Comercial, Func]
        - /form-branch            → BranchOfficeTables         [Adm, Adm]
        - /form-cat-servico       → ServiceCategoryTables      [Adm, Adm]
        - /form-sub-cat-servico   → SubServiceCategoryTable    [Adm, Adm, Comercial]
        - /ordem-servico          → OrdemServiceTables         [todos]
        - /basic-tables           → WhatsApp Atendimentos      [Adm, Adm, Comercial]
        - /whatsapp/config        → WhatsappConfigPage         [Adm apenas]
        - /financeiro/despesas    → Despesas                   [Adm, Financeiro]
        - /notificacoes/enviar    → Notifications              [Adm apenas]
        - /notificacoes/historico → Historico                  [todos]
        - /logs                   → Log                        [Adm apenas]
        - /customer-access        → CustomerAccessPage         [Adm, Adm] (TEMPORÁRIO)
        - /gestao/gerenciar-checkins → GerenciarCheckIns       [Adm apenas]
        - /documentacao           → Documentacao               [todos — filtrado por role no frontend]

    state_management:
      stores: [authStore, filterStore, modalStore, uiStore]  # Zustand
      contexts: [SidebarContext, ThemeContext, FisioterapeutaContext]

    services:
      base: BaseApiService (src/services/api/BaseApiService.ts)
      http_client: AxioService (src/services/service/AxioService.ts)
      api_services:
        - AuthService
        - CustomerService / CustomerService.refactored
        - BranchOfficeService / BranchOfficeService.refactored
        - EmployeeService / EmployeeService.refactored
        - OrderServiceService / OrderServiceService.refactored
        - ScheduleService / ScheduleService.refactored
        - ScheduleParticipantService / ScheduleParticipantService.refactored
        - ServiceCategoryService / ServiceCategoryService.refactored
        - SubCategoryService / SubCategoryService.refactored
        - SessionService / SessionService.refactored
        - DashboardService / DashboardService.refactored
        - DespesaService / DespesaService.refactored
        - FinancialTransactionService / FinancialTransactionService.refactored
        - NotificationService / NotificationService.refactored
        - CustomerAccessService / CustomerAccessService.refactored
        - WhatsappService  # src/services/WhatsappService.ts (sem versão refactored ainda)
        - LogService       # src/services/LogService.ts
        - UserService      # src/services/service/UserService.ts — getUserAccessByFuncionarioId, removeRole, addRole
      polling:
        - WhatsApp conversas: 30s
        - WhatsApp config (números): 60s

    key_components:
      calendar:
        - CalendarView, CalendarFiltersPanel, CalendarEventModals
      dashboard:
        - FaturamentoMetrics, DespesasMetrics, TransactionsMetrics
        - MonthlySalesChart, MonthlySessionsChart, FaturamentoComparativo

  # ── 3. PORTAL CLIENTE ───────────────────────────────────────────────────────
  - name: instituto-barros-portal-cliente
    type: frontend
    description: >
      Portal self-service para pacientes da clínica. Permite login com CPF,
      visualização de perfil, histórico de agendamentos, solicitação e cancelamento
      de consultas, e reset de senha por email.
    framework: Next.js 16 + TypeScript + TailwindCSS v3
    path: PortalCliente/
    deployed_at: Vercel (https://instituto-barros-portal-cliente.vercel.app)
    dev_port: 3000

    dependencies:
      ui: [TailwindCSS v3, Lucide React, Next Themes]
      http: [Axios v1.13]
      calendar: [FullCalendar v6]
      validation: [Zod v4]
      utilities: [dayjs, clsx, Flatpickr, Swiper]

    key_pages:
      auth: [/auth/signin, /auth/signup]
      main:
        - / → home/dashboard do paciente
        - /plano → planos de tratamento
        - /profile → perfil do paciente
        - /calendar → calendário de agendamentos
        - /confirmacao-solicitacao → confirmação de agendamento

    auth:
      login_method: CPF + senha
      endpoint: POST /Api/User/LoginCliente
      password_reset:
        step1: POST /Api/User/SolicitarResetSenha (CPF + Email)
        step2: POST /Api/User/ResetarSenha (UserId + token + nova senha)

    services_path: PortalCliente/src/services/

  # ── 4. SITE INSTITUCIONAL ───────────────────────────────────────────────────
  - name: instituto-barros-site
    type: frontend
    description: >
      Site institucional público do Instituto Barros. Apresenta a clínica,
      serviços, equipe, unidades e galeria. Sem integração com a API.
    framework: React 19 + Vite + TypeScript + TailwindCSS v3
    path: Site/
    dev_port: não definido

    pages:
      - Home: hero, serviços, sobre, equipe, instalações, galeria, unidades, CTA
      - About: hero, sobre, equipe

    sections:
      - HeroSection, ServicesSection, AboutSection
      - TeamSection, FacilitiesSection, GallerySection
      - UnitsSection, CTASection

  # ── 5. BOT WHATSAPP (n8n) ──────────────────────────────────────────────────
  - name: instituto-barros-bot-whatsapp
    type: automation
    description: >
      Fluxo n8n de atendimento automatizado via WhatsApp. Integra com Evolution API
      para recepção de mensagens, Redis para estado da conversa, e a API backend
      para persistência de mensagens e conversas.
    path: Bot/InstitutoBarrosAtendimento.json
    platform: n8n (self-hosted, Docker)
    node_count: ~145

    external_integrations:
      - name: Evolution API
        type: WhatsApp Gateway
        instance: InstitutoBarros
        base_url: http://api:8080  # endereço interno Docker
        auth_header: apikey
      - name: Redis
        use: estado da conversa (esteira de atendimento, respostas, sessão)
      - name: Instituto Barros API
        base_url: "{{ ApiBaseUrl }}"  # definido no nó Variáveis Config
        auth: "Bearer {{ ApiServiceToken }}"  # token JWT de usuário de serviço

    key_nodes:
      - "Webhook: entrada de mensagens do Evolution API"
      - "Tratamento dados: extrai phone, pushName, mensagem do webhook"
      - "Variáveis Config: InstanciaWhatsapp, TokenWhatsapp, Identificador, MensagemTrocada, ApiBaseUrl, ApiServiceToken"
      - "Ignora mensagens do próprio bot: filtra eco"
      - "Verificação usuário em atendimento: consulta Redis"
      - "Switch Estado Conversa: roteamento por estado (Redis)"
      - "Decide esteira de atendimento: Reabilitação / Prevenção/Recovery / Agendamento / Nenhum Serviço"
      - "Persistir Msg Recebida: POST /api/Whatsapp/ReceberMensagem (cliente→bot)"
      - "No Operation* (x8 substituídos): POST /api/Whatsapp/ReceberMensagem (bot→cliente + fim de conversa)"

    flow_paths:
      - Reabilitação: pergunta dor → nível → fisio → faz sentido → agendamento
      - Prevenção/Recovery: pergunta dor → nível → atividade → fortalecimento → análise → clínica
      - Liberação: pergunta dor → atividade → tratamento → faz sentido
      - Agendamento: unidade (Morumbi/Mooca/Paulista/Ipiranga) → coleta dados → confirmação
      - Informações: dúvidas → convênio → reembolso → CTA agendamento
      - Nenhum Serviço: contato especialista

    variables_config:
      InstanciaWhatsapp: InstitutoBarros
      TokenWhatsapp: "<EVOLUTION_API_TOKEN>"  # valor real em vault/secret — não commitar aqui (SEC001)
      ApiBaseUrl: http://api:8080
      ApiServiceToken: "<JWT_SERVICE_TOKEN>"  # ← substituir por token real do usuário de serviço

# ─────────────────────────────────────────────
# INFRAESTRUTURA COMPARTILHADA
# ─────────────────────────────────────────────
shared_platform:

  databases:
    - provider: sqlserver
      name: Instituto Barros DB
      connection_key: DefaultConnection (appsettings.json)
      orm: Entity Framework Core 8 (Code First, Migrations)
      host: "(Azure SQL ou local)"

    - provider: mongodb
      name: leads
      connection_key: MongoConnection (appsettings.json)
      driver: MongoDB.Driver
      use_case: Leads capturados pelo bot WhatsApp via n8n

    - provider: redis
      use_case: Estado da conversa do bot n8n (fila de atendimento, respostas salvas)
      credential: "<REDIS_PASSWORD>"  # valor real em vault/secret — não commitar aqui (SEC001)

  hosting:
    - service: Azure Web App
      app: instituto-barros-sistema
      type: container (Docker)
      image: tecnologiainstitutobarrros/sistema-instituto
    - service: Vercel
      apps: [sistema-instituto, instituto-barros-portal-cliente]
    - service: n8n self-hosted
      runtime: Docker (interno)

  ci_cd:
    - provider: GitHub Actions
      trigger: push to main (Instituto_Barros_Sistema/)
      steps: [build Docker image → push Docker Hub → deploy Azure Web App]

  observability:
    - logs: LogModel (banco SQL) + AuditLogService (registro de ações críticas)
    - frontend_errors: console.error + react-hot-toast / react-toastify

  authentication:
    - ASP.NET Identity (gestão de usuários e roles)
    - JWT Bearer (1h, HttpOnly cookie)
    - CSRF Token (X-CSRF-Token header)

  patterns:
    architecture: DDD, Clean Architecture, Repository Pattern
    backend:
      framework: .NET 8.0
      language: C#
      orm: Entity Framework Core 8
      validation: FluentValidation
      mapping: AutoMapper
      encryption: AES-256 CBC (DatabaseEncryptionHelper)
    frontend_admin:
      framework: React 18 + Vite
      language: TypeScript
      state: Zustand
      styling: TailwindCSS v4
    portal_cliente:
      framework: Next.js 16
      language: TypeScript
      styling: TailwindCSS v3
    site:
      framework: React 19 + Vite
      language: TypeScript
      styling: TailwindCSS v3
    automation:
      platform: n8n
      external_api: Evolution API (WhatsApp)

